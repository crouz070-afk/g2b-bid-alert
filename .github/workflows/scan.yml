name: g2b-bid-scan

on:
  schedule:
    # cron은 UTC. KST = UTC+9.
    # 평일(월~금) 07:00~20:59 KST는 5분마다 — 새 공고를 남보다 먼저 받기 위해
    - cron: "*/5 22-23 * * 0-4"   # 월~금 07~08시 KST
    - cron: "*/5 0-11 * * 1-5"    # 월~금 09~20시 KST
    # 그 밖의 시간은 1시간마다(07분). 실행이 빠져도 다음 실행이 직전 실행시각부터 되짚는다.
    - cron: "7 12-21 * * *"       # 매일 21~06시 KST
    - cron: "7 22-23 * * 5,6"     # 토·일 07~08시 KST
    - cron: "7 0-11 * * 0,6"      # 토·일 09~20시 KST
  workflow_dispatch:              # 수동 실행 버튼

permissions:
  contents: write                 # state.json / notices.json / history.csv 커밋용
  pages: write
  id-token: write

concurrency:
  group: g2b-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.scan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: python -m pip install --quiet pynacl

      - name: 스캔 및 알림
        id: scan
        env:
          G2B_SERVICE_KEY:     ${{ secrets.G2B_SERVICE_KEY }}
          KAKAO_REST_KEY:      ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_TOKEN_KEY:     ${{ secrets.KAKAO_TOKEN_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PYTHONIOENCODING:    utf-8
        run: python g2b_scan.py --notify

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "g2b-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -q -m "scan: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull -q --rebase --autostash
            git push -q
          fi

      - name: 페이지 업로드
        if: steps.scan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scan
    if: always() && needs.scan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
