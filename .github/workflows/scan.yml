name: g2b-bid-scan

on:
  schedule:
    # GitHub Actions의 cron은 UTC. KST = UTC+9.
    - cron: "0 23 * * *"   # 08:00 KST
    - cron: "0 9 * * *"    # 18:00 KST
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # state.json / history.csv / docs 커밋용

concurrency:
  group: g2b-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow pynacl
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum

      - name: 스캔 및 알림
        env:
          G2B_SERVICE_KEY:     ${{ secrets.G2B_SERVICE_KEY }}
          KAKAO_REST_KEY:      ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT:              ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          PYTHONIOENCODING:    utf-8
        run: python g2b_scan.py --notify

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "g2b-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git add -A state.json history.csv last_hits.json last_meta.json last_summary.txt docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "scan: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash
            git push
          fi

      - name: 표 이미지 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notices-png
          path: out/*
          if-no-files-found: ignore
          retention-days: 90
