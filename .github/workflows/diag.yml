name: diag-api-reach

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - name: 조달청 API 접속 시험
        run: |
          echo "runner ip: $(curl -s -m 10 https://api.ipify.org)"
          getent ahosts apis.data.go.kr | head -3
          for i in 1 2 3; do
            curl -s -o /dev/null -m 20 -w "try$i code=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" \
              "https://apis.data.go.kr/1230000/ad/BidPublicInfoService/getBidPblancListInfoServc?type=json&pageNo=1&numOfRows=1" || echo "try$i FAIL"
          done
